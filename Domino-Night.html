 if(!Number.isInteger(n)||n<8||n>48)throw Error('Use 8 to 48 players.');

   return patterns.map(p=>({p,c:(partnered[key(p[0],p[1])]||0)+(partnered[key(p[2],p[3])]||0)})).sort((a,b)=>a.c-b.c)[0];

 for(let r=0;r<3;r++){
   const pool=shuffle(Array.from({length:n},(_,i)=>i)).sort((a,b)=>rests[a]-rests[b]);
   const byes=pool.slice(0,n%4);byes.forEach(p=>rests[p]++);

   for(let step=0;step<7000 && bestCost>0;step++){

ve before starting the next round.</p></section><section class="panel"><h3>Keep your event safe</h3><p class="small">Progress saves in this browser. Download a backup after each round. Restore it here if you change browsers or computers.</p><button id="newEvent" class="danger">Start new event</button></section></aside></div>`;}

function rulesView(){return `<section class="panel rules"><div class="sectionbar"><h2>Tournament rules</h2><button id="print">Print rules</button></div><p><b>${state.players.length} registered players · ${state.tables} tables · 3 qualifying rounds · Top 8 players advance</b></p><ol><li><b>Rotation.</b> Each round uses new partners. Tablemate repeats are minimized. With more players than seats, finish all waves of a round before starting the next. Byes rotate as evenly as possible.</li><li><b>Race to 100.</b> Play successive hands until a team reaches 100 or more points. That team wins one match. Both players receive the team’s full final points, including points above 100. A 108–75 result gives each winner one win and 108 points; each loser receives 75 points and no win.</li><li><b>Byes.</b> A bye is not a played match and earns no wins, losses, or points. A player with a bye may play two qualifying matches while other players play three.</li><li><b>Standings.</b> Rank by wins divided by matches played, then total points divided by matches played. Compare full values, not rounded display numbers. This is equivalent to wins then total points when everyone plays the same number of matches.</li><li><b>Final tiebreaker.</b> Once all qualifying matches are complete, exact ties are resolved by a random draw. The organizer runs the draw publicly using “Draw ties & create playoffs.” The drawn order is recorded and saved.</li><li><b>Qualification.</b> The top eight individual players form four fixed teams: 1+8, 2+7, 3+6, and 4+5. Other players do not advance.</li><li><b>Playoffs.</b> Semifinal A: (1+8) vs (4+5). Semifinal B: (2+7) vs (3+6). Winning teams meet in the final with the same partners. Scores start at zero in every match; qualifying totals do not carry over. Each match is a race to 100 or more. One loss eliminates a team; the final’s winning team is champion.</li><li><b>Score reporting.</b> Both teams confirm their final score before the organizer records it. Correct qualifying scores before creating playoffs. Changing qualifying scores afterward requires clearing the bracket and its results, then creating it again.</li><li><b>House gameplay rules.</b> Before play, the host announces the domino variant, opening player, legal plays, passing or drawing, blocked or tied hands, and points awarded per hand. Apply these consistently at every table.</li></ol></section><section class="panel no-print"><h2>Event-day setup</h2><ol><li>Open this file in Chrome or Edge on the event laptop. Keep a single organizer tab.</li><li>Enter names, set your table count, and generate the schedule after registration closes. Check the Players tab before each event; this browser remembers the previous event.</li><li>Print the rules and all three rounds. Have paper scorecards ready as a backup.</li><li>Connect your TV as an extended display. Click <b>Open TV display</b>, move that window to the TV, and use full screen. Standings cycle through pages every 12 seconds.</li><li>Enter confirmed scores. Export a backup after each round and before the playoff cut.</li><li>After every qualifying match is saved, review standings and publicly run the draw. Enter semifinal and final scores.</li></ol><div class="notice">The TV view syncs between tabs in the <b>same browser on the same computer</b>. Casting or HDMI shows that TV window. Opening the file on another device does not connect to the event.</div><p class="small">Use the same browser and file location throughout the event. Browser storage can be cleared, so keep downloaded backups. If opening the file directly does not sync TV tabs, use the included local launch shortcut. No internet or paid account is required.</p></section>`;}
function renderTV(){const allDone=D.complete(state),r=state.rounds.length?nextRound():0;let right='';if(state.playoffs&&tvMode!=='standings'){right=playoffsView(true);}else if(state.rounds.length){const round=state.rounds[r];right=`<div class="sectionbar"><h2>${allDone?'Qualifying complete':`Round ${r+1} · Table assignments`}</h2></div><div class="grid">${round.matches.map(m=>scoreCard(m,'',`Table ${m.table}${m.wave>1?' · Wave '+m.wave:''}`,false,true)).join('')}</div>${round.byes.length?`<p class="tv-bye">Byes: ${round.byes.map(i=>esc(state.players[i])).join(', ')}</p>`:''}`;}else right='<div class="panel"><h2>Registration is open</h2><p>Three qualifying rounds, then the top eight players advance.</p><p>Tell the organizer your name to join.</p></div>';
 const pages=Math.ceil(state.players.length/tvPageSize());if(tvPage>=pages)tvPage=0;
 $('tvToggle').textContent=tvMode==='standings'?'Show tables & bracket':'Standings only';
 $('main').innerHTML=stats()+`<div class="tv-grid" ${tvMode==='standings'?'style="grid-template-columns:1fr"':''}><section><div class="sectionbar"><h2>${state.playoffs?'Qualifying results':'Live standings'}</h2><span class="muted small">${tvPage+1} / ${pages}</span></div>${standingsTable(true)}<p class="small muted">Win % → average points → random draw${!state.playoffs?' · Provisional ranking':''}</p></section>${tvMode==='standings'?'':`<section>${right}</section>`}</div>`;
}
function readPlayers(){const names=$('namesInput').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(names.length<8||names.length>48)throw Error('Enter 8 to 48 players.');if(names.some(s=>s.length>70))throw Error('Keep player names under 71 characters.');if(new Set(names.map(s=>s.toLowerCase())).size!==names.length)throw Error('Give every player a unique name (add a last initial if needed).');if(state.rounds.length&&names.length!==state.players.length)throw Error('The schedule is locked. Rename players on their existing lines, or start a new event to change the player count.');const tables=Number($('tablesInput').value);if(!Number.isInteger(tables)||tables<1||tables>12)throw Error('Enter 1 to 12 tables.');const title=$('titleInput').value.trim();if(!title)throw Error('Enter an event name.');return {names,tables,title};}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render();});document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>{roundIndex=Number(b.dataset.round);render();});document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>saveScore(b.dataset.score));
 if($('print'))$('print').onclick=()=>window.print();if($('csv'))$('csv').onclick=exportCSV;
 if($('applyCount'))$('applyCount').onclick=()=>{const n=Number($('countInput').value);if(!Number.isInteger(n)||n<8||n>48)return tell('Use 8 to 48 players.');let names=$('namesInput').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);while(names.length<n)names.push(`Player ${names.length+1}`);$('namesInput').value=names.slice(0,n).join('\n');tell('Player slots updated. Save names when ready.');};
 if($('savePlayers'))$('savePlayers').onclick=()=>{try{const p=readPlayers();Object.assign(state,{title:p.title,players:p.names,tables:p.tables});save();render();tell('Names saved.');}catch(e){tell(e.message);}};
 if($('generate'))$('generate').onclick=async()=>{try{const p=readPlayers();if(!(await ask('Lock registration & generate rounds?',`${p.names.length} players on ${p.tables} tables. ${p.names.length%4?'Each round has '+p.names.length%4+' rotating byes. ':''}You can rename players afterward, but changing the player count requires a new event.`,'Generate schedule')))return;$('generate').disabled=true;$('generate').textContent='Preparing tables…';await new Promise(r=>setTimeout(r,30));const rounds=D.schedule(p.names.length,p.tables);Object.assign(state,{title:p.title,players:p.names,tables:p.tables,rounds,playoffs:null});save();view='rounds';roundIndex=0;render();tell('Three rounds ready. No player has a repeated teammate.');}catch(e){tell(e.message);render();}};
 if($('cut'))$('cut').onclick=async()=>{if(await ask('Draw ties & create playoffs?','Review all scores first. Exact ties will be resolved randomly once, and the top eight will become four fixed teams. Show the draw record to players.','Run draw & create teams')){backup();state.playoffs=D.createPlayoffs(state);save();view='playoffs';render();tell('Playoff teams created. The random draw order is saved in Standings.');}};
 if($('newEvent'))$('newEvent').onclick=async()=>{if(await ask('Start a new event?','Export a backup first if you need this event. This clears the schedule, results, and playoff draw, while keeping your current player list.','Start new event')){backup();state.rounds=[];state.playoffs=null;save();view='registration';render();}};
 if($('printSchedule'))$('printSchedule').onclick=()=>{$('main').innerHTML=state.rounds.map((r,i)=>`<section class="round-print">${roundBlock(i,true)}</section>`).join('');window.print();render();};
}
async function saveScore(id){const aText=$(id+'-0').value,bText=$(id+'-1').value,a=Number(aText),b=Number(bText);if(!aText.trim()||!bText.trim()||!D.validScore(a,b)){tell('Enter two whole-number scores: winner 100 or more, loser 0–99. Overshoot points count.');return;}const parts=id.split('-');let m;if(parts[0]==='q')m=state.rounds[Number(parts[1])].matches[Number(parts[2])];else if(parts[0]==='s')m=state.playoffs.semis[Number(parts[1])];else m=state.playoffs.final;if(m.score?.[0]===a&&m.score?.[1]===b){tell('This result is already saved.');return;}
 if(parts[0]==='q'&&state.playoffs){if(!await ask('Clear playoffs to correct qualifying?','This correction changes qualifying standings. The playoff draw, teams, and all playoff results will be cleared. Export a backup first if you need the old results.','Correct score & clear playoffs'))return;backup();state.playoffs=null;}
 if(parts[0]==='s'&&state.playoffs.final?.score){if(!await ask('Clear the final result?','Changing a semifinal requires rebuilding the final. Its saved result will be cleared.','Update semifinal'))return;backup();}
 m.score=[a,b];if(parts[0]==='s')D.syncFinal(state.playoffs);save();render();tell('Result saved. Standings and TV display updated.');}
async function restore(e){const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('Backup file is too large.');const parsed=D.validate(JSON.parse(await file.text()));if(await ask('Restore this event?',`Load “${parsed.title}” with ${parsed.players.length} players? This replaces the event in this browser. Export the current event first if needed.`,'Restore event')){if(!loadError)backup();state=parsed;loadError=false;save();view=state.rounds.length?'rounds':'registration';roundIndex=0;render();tell('Backup restored.');}}catch(err){tell('Could not restore: '+err.message);}}
if(isTV){setInterval(()=>{tvPage=(tvPage+1)%Math.ceil(state.players.length/tvPageSize());renderTV();},12000);window.addEventListener('resize',()=>renderTV());}
render();
</script></body></html>
